name: Accuracy report → Jira

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  create-jira:
    if: >-
      contains(github.event.issue.labels.*.name, 'accuracy-report') ||
      startsWith(github.event.issue.title, '[Accuracy]') ||
      startsWith(github.event.issue.title, 'Accuracy report')
    runs-on: ubuntu-latest
    steps:
      - name: Validate configuration
        id: config
        shell: bash
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY || 'DAYCARE' }}
        run: |
          if [[ -z "$JIRA_BASE_URL" || -z "$JIRA_EMAIL" || -z "$JIRA_API_TOKEN" || -z "$JIRA_PROJECT_KEY" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Create Jira issue
        if: steps.config.outputs.ready == 'true'
        id: jira
        shell: bash
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY || 'DAYCARE' }}
          GH_TITLE: ${{ github.event.issue.title }}
          GH_BODY: ${{ github.event.issue.body }}
          GH_URL: ${{ github.event.issue.html_url }}
          GH_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' > payload.json
          import json, os
          description = (
              f"Website accuracy report from GitHub issue #{os.environ['GH_NUMBER']}\n\n"
              f"GitHub report: {os.environ['GH_URL']}\n\n"
              f"{os.environ.get('GH_BODY','')}\n\n"
              "Governance: Research must use authoritative evidence. Bot may propose a PR but must not merge without HITL approval."
          )
          payload = {
              "fields": {
                  "project": {"key": os.environ["JIRA_PROJECT_KEY"]},
                  "summary": os.environ["GH_TITLE"][:250],
                  "issuetype": {"name": "Bug"},
                  "description": {
                      "type": "doc",
                      "version": 1,
                      "content": [{
                          "type": "paragraph",
                          "content": [{"type": "text", "text": description[:30000]}]
                      }]
                  },
                  "labels": ["daycare-planner", "accuracy-report", "source-github"]
              }
          }
          print(json.dumps(payload))
          PY

          response=$(curl --fail-with-body -sS \
            -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -X POST "$JIRA_BASE_URL/rest/api/3/issue" \
            --data @payload.json)
          echo "$response" > jira-response.json
          key=$(python -c "import json; print(json.load(open('jira-response.json'))['key'])")
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "url=$JIRA_BASE_URL/browse/$key" >> "$GITHUB_OUTPUT"

      - name: Link Jira ticket back to report
        if: steps.config.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          JIRA_KEY: ${{ steps.jira.outputs.key }}
          JIRA_URL: ${{ steps.jira.outputs.url }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "Created Jira ticket **[$JIRA_KEY]($JIRA_URL)** in the dedicated Daycare project. Next state: research and evidence collection. Production changes remain human-approved only."

      - name: Configuration notice
        if: steps.config.outputs.ready != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "Accuracy report captured. Jira automation targets the dedicated **DAYCARE** project, but Jira credentials still need to be configured in repository secrets before ticket creation can run."
